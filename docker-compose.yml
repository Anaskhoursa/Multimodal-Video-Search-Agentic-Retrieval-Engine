services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: video_engine_api
    env_file:
      - .env
    ports:
      - "8000:8000"
    environment:
      STORAGE_DIR: /app/storage
      QDRANT_URL: http://qdrant:6333
      OLLAMA_URL: http://ollama:11434
    volumes:
      - video_storage:/app/storage
      - model_cache:/models
    depends_on:
      qdrant:
        condition: service_started
      ollama:
        condition: service_started
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.13.2
    container_name: video_engine_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: video_engine_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_storage:/root/.ollama
    restart: unless-stopped

volumes:
  qdrant_storage:
  ollama_storage:
  video_storage:
  model_cache:
