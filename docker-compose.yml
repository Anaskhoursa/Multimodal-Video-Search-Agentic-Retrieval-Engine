version: '3.8'

services:
  api:
    build: .
    container_name: video_engine_api
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - ./storage:/app/storage
    environment:
      - STORAGE_DIR=/app/storage
    depends_on:
      - qdrant

  qdrant:
    image: qdrant/qdrant:latest
    container_name: video_engine_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

volumes:
  qdrant_storage: