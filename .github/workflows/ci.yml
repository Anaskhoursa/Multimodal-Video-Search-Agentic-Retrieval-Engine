name: Python checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-and-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lightweight test dependencies
        run: python -m pip install --upgrade pip httpx python-dotenv
      - name: Compile all Python files
        run: python -m compileall -q main.py config core tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
